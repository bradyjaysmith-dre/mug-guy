<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mug Guy — Curated Vintage Mugs</title>
  <meta name="description" content="Handpicked vintage and novelty mugs from Salt Lake City. Every mug has a story." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="logo-wrap">
      <div class="logo">Mug <span>Guy</span></div>
      <div class="tagline">Curated vintage mugs · SLC, Utah</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link active">Mugs</a>
      <a href="finds.html" class="nav-link">Finds</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="https://www.ebay.com/usr/bradysnano" target="_blank" rel="noopener" class="ebay-store-btn">
        ↗ eBay store
      </a>
    </nav>
  </header>

  <div class="filters-bar">
    <span class="filter-label">Filter:</span>
    <button class="filter-chip active" data-filter="all">All mugs</button>
    <button class="filter-chip" data-filter="vintage">Vintage</button>
    <button class="filter-chip" data-filter="novelty">Novelty</button>
    <button class="filter-chip" data-filter="ceramic">Ceramic</button>
    <button class="filter-chip" data-filter="holiday">Holiday</button>
    <select class="sort-select" id="sortSelect">
      <option value="newest">Sort: newest</option>
      <option value="low">Sort: price low–high</option>
      <option value="high">Sort: price high–low</option>
    </select>
  </div>

  <main class="gallery-wrapper">
    <div class="gallery-meta">
      <span class="gallery-title">The Collection</span>
      <span class="gallery-count" id="galleryCount"></span>
    </div>
    <div class="mug-grid" id="mugGrid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-trust">
      🔒 All purchases handled securely through eBay — buyer protection included
    </div>
    <div class="footer-links">
      <a href="finds.html">Finds</a>
      <a href="about.html">About</a>
      <a href="https://www.ebay.com/usr/bradysnano" target="_blank" rel="noopener">eBay store</a>
    </div>
    <div class="footer-copy">© 2026 Mug Guy · Salt Lake City, UT</div>
  </footer>

  <script src="js/mugs.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
